<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rift Cut</title>
  <meta name="description" content="Slice neon gates in this one-button browser flyer. Don't clip the walls.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Rift Cut">
  <meta property="og:description" content="Slice neon gates in this one-button browser flyer. Don't clip the walls.">
  <meta property="og:url" content="https://chive55.github.io/rift-cut/">
  <meta property="og:image" content="https://raw.githubusercontent.com/chive55/rift-cut/main/og.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Rift Cut">
  <meta name="twitter:description" content="Slice neon gates in this one-button browser flyer. Don't clip the walls.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/chive55/rift-cut/main/og.svg">
  <link rel="canonical" href="https://chive55.github.io/rift-cut/">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #07080f; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
      color: #eef2ff;
    }
    #score { font-variant-numeric: tabular-nums; letter-spacing: 0.14em; font-weight: 700; font-size: 22px; text-shadow: 0 0 18px #7cff6b88; }
    #panel {
      pointer-events: auto; text-align: center; background: #0b0d18ee;
      border: 1px solid #7cff6b33; border-radius: 16px; padding: 24px 28px; max-width: 420px;
    }
    #panel h1 { margin: 0 0 8px; letter-spacing: 0.18em; font-size: 28px; }
    #panel p { margin: 0 0 16px; color: #b7c0e0; line-height: 1.45; }
    button {
      min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px;
      background: #7cff6b; color: #0b0c14; font-weight: 800; cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="score">0</div>
    <div id="panel">
      <h1>RIFT CUT</h1>
      <p>Hold to climb. Release to fall. Thread the glowing gates. Best: <span id="best">0</span></p>
      <button id="go" type="button">Play</button>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const panel = document.getElementById('panel');
    const go = document.getElementById('go');
    const bestEl = document.getElementById('best');
    const KEY = 'rift-cut-best';

    let W = 0, H = 0, dpr = 1;
    let running = false, dead = false, holding = false;
    let t = 0, score = 0, shake = 0;
    let best = Number(localStorage.getItem(KEY) || 0);
    bestEl.textContent = String(best);

    const player = { x: 0, y: 0, vy: 0, r: 11 };
    const gates = [];
    const sparks = [];

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth;
      H = innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', resize);
    resize();

    function reset() {
      running = true;
      dead = false;
      score = 0;
      t = 0;
      player.x = W * 0.28;
      player.y = H * 0.5;
      player.vy = 0;
      gates.length = 0;
      sparks.length = 0;
      for (let i = 0; i < 4; i++) spawnGate(W * 0.7 + i * 280);
      panel.classList.add('hidden');
      scoreEl.textContent = '0';
    }

    function spawnGate(x) {
      const gap = Math.max(118, 210 - score * 1.1);
      const mid = 90 + Math.random() * (H - 180);
      gates.push({ x, gap, mid, passed: false });
    }

    function burst(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 40 + Math.random() * 180;
        sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color });
      }
    }

    function die() {
      if (dead) return;
      dead = true;
      running = false;
      shake = 14;
      burst(player.x, player.y, '#7cff6b', 28);
      burst(player.x, player.y, '#ff5d73', 12);
      if (score > best) {
        best = score;
        localStorage.setItem(KEY, String(best));
        bestEl.textContent = String(best);
      }
      panel.querySelector('p').innerHTML = 'Cut ' + score + ' gates. Best: <span id="best">' + best + '</span>';
      go.textContent = 'Again';
      panel.classList.remove('hidden');
    }

    function input(down) { holding = down; if (!running && !down) return; }
    addEventListener('pointerdown', e => { e.preventDefault(); if (!running) reset(); input(true); });
    addEventListener('pointerup', () => input(false));
    addEventListener('pointercancel', () => input(false));
    addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        if (!running) reset();
        input(true);
      }
    });
    addEventListener('keyup', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') input(false);
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden) holding = false; });
    go.addEventListener('click', e => { e.stopPropagation(); reset(); });

    let last = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      t += dt;
      if (shake > 0) shake *= 0.86;

      const ox = (Math.random() - 0.5) * shake;
      const oy = (Math.random() - 0.5) * shake;
      ctx.fillStyle = '#07080f';
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.translate(ox, oy);

      ctx.strokeStyle = '#7cff6b10';
      ctx.lineWidth = 1;
      for (let y = 40; y < H; y += 48) {
        ctx.beginPath();
        ctx.moveTo(0, y + Math.sin(t * 1.4 + y * 0.02) * 4);
        ctx.lineTo(W, y + Math.sin(t * 1.4 + y * 0.02) * 4);
        ctx.stroke();
      }

      const speed = 210 + score * 6;
      if (running) {
        player.vy += (holding ? -980 : 820) * dt;
        player.vy = Math.max(-420, Math.min(460, player.vy));
        player.y += player.vy * dt;
        if (player.y < 18 || player.y > H - 18) die();

        for (const g of gates) {
          g.x -= speed * dt;
          if (!g.passed && g.x + 16 < player.x) {
            g.passed = true;
            score += 1;
            scoreEl.textContent = String(score);
            burst(player.x + 10, player.y, '#7cff6b', 8);
          }
          const half = g.gap / 2;
          const inX = player.x + player.r > g.x && player.x - player.r < g.x + 26;
          const inGap = player.y > g.mid - half && player.y < g.mid + half;
          if (inX && !inGap) die();
        }
        while (gates.length && gates[0].x < -40) gates.shift();
        if (gates.length && gates[gates.length - 1].x < W - 60) spawnGate(gates[gates.length - 1].x + 260 + Math.random() * 50);
      }

      for (const g of gates) {
        const half = g.gap / 2;
        ctx.fillStyle = '#12162c';
        ctx.fillRect(g.x, 0, 26, g.mid - half);
        ctx.fillRect(g.x, g.mid + half, 26, H - (g.mid + half));
        ctx.fillStyle = '#7cff6b';
        ctx.fillRect(g.x, g.mid - half - 6, 26, 6);
        ctx.fillRect(g.x, g.mid + half, 26, 6);
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.life -= dt * 1.8;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.globalAlpha = s.life;
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x, s.y, 3, 3);
        ctx.globalAlpha = 1;
      }

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(Math.atan2(player.vy, 280));
      ctx.fillStyle = '#e8ffe4';
      ctx.beginPath();
      ctx.moveTo(16, 0);
      ctx.lineTo(-12, 8);
      ctx.lineTo(-8, 0);
      ctx.lineTo(-12, -8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#7cff6b';
      ctx.fillRect(-18, -2, 10, 4);
      ctx.restore();

      ctx.restore();
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
